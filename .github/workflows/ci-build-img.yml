name: Build and publish DataMapper

on:
  push:
    branches:
      - test-datamapper-ts
    paths:
      - '.env.test'

permissions:             
  contents: read
  packages: write

jobs:
  PackageDeploy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2

      - name: Docker Setup BuildX
        uses: docker/setup-buildx-action@v2

      - name: Load environment variables and set them
        run: |
          if [ -f .env.test ]; then
            export $(cat .env.test | grep -v '^#' | xargs)
          fi
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV
          echo "FIX=$FIX" >> $GITHUB_ENV

      - name: Set repo
        run: |
           echo "DOCKER_TAG_CUSTOM=ghcr.io/${{ github.repository_owner }}/datamapper:$RELEASE-$VERSION.$BUILD.$FIX" >> $GITHUB_ENV

      - name: Docker Build
        run: docker image build --tag $DOCKER_TAG_CUSTOM --no-cache .

      - name: Log in to GitHub container registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u varmoh --password-stdin

      - name: Push Docker image to ghcr
        run: docker push $DOCKER_TAG_CUSTOM
